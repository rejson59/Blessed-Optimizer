name: Build Blessed Optimizer for Windows

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
    inputs:
      publish_version:
        description: "Opcjonalny tag wydania (np. v1.0.0). Publikuj tylko z gałęzi main."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: blessed-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Publish self-contained Windows x64 installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish one self-contained EXE
        shell: pwsh
        run: >-
          dotnet publish app/BlessedOptimizer/BlessedOptimizer.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Prepare installer and SHA-256 checksum
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.publish_version }}
          RELEASE_TAG: ${{ inputs.publish_version || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $isVersionedRelease = ($env:GITHUB_REF -like "refs/tags/*") -or -not [string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)
          if ($isVersionedRelease -and $tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use the vMAJOR.MINOR.PATCH format, e.g. v1.0.0."
          }
          if ($isVersionedRelease) {
            [xml]$project = Get-Content "app/BlessedOptimizer/BlessedOptimizer.csproj" -Raw
            $projectVersion = [string]$project.Project.PropertyGroup.Version
            if ($tag.Substring(1) -ne $projectVersion) {
              throw "Release tag $tag does not match the project version $projectVersion. Update the project version first."
            }
          }
          $source = "artifacts/publish/BlessedOptimizer.exe"
          $installer = "artifacts/BlessedOptimizer-Setup.exe"
          if (-not (Test-Path $source)) { throw "Published executable was not found: $source" }
          Copy-Item $source $installer
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "artifacts/SHA256SUMS.txt" -Value "$hash  BlessedOptimizer-Setup.exe" -Encoding ascii
          $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $releaseInfo = @{
            tag_name = $tag
            assets = @(
              @{ name = "BlessedOptimizer-Setup.exe"; browser_download_url = "$baseUrl/BlessedOptimizer-Setup.exe" },
              @{ name = "SHA256SUMS.txt"; browser_download_url = "$baseUrl/SHA256SUMS.txt" }
            )
          } | ConvertTo-Json -Depth 4
          Set-Content -Path "artifacts/BlessedOptimizer-release.json" -Value $releaseInfo -Encoding utf8

      - name: Upload CI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlessedOptimizer-win-x64-${{ github.run_id }}
          path: |
            artifacts/BlessedOptimizer-Setup.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets for version tags
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.publish_version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Blessed Optimizer ${{ inputs.publish_version || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/BlessedOptimizer-Setup.exe
            artifacts/SHA256SUMS.txt
            artifacts/BlessedOptimizer-release.json
          fail_on_unmatched_files: true
